name: Build Windows EXE

# Produces TwinPane.exe in the run summary / release assets.
#
# Why a Windows runner: PyInstaller cannot cross-compile - a Linux box cannot
# emit a .exe.  This job runs natively on windows-latest, which is free for
# public repositories.  Download the artefact from the Actions run, or push a
# tag (v*) to get it attached to a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    working-directory: twin-pane-explorer

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller windows-curses pytest

      - name: Environment probe
        shell: pwsh
        run: |
          python -c "import sys,platform;print(sys.version);print(platform.platform())"
          python -m pip list 2>$null | Select-String -Pattern "curses|pytest"
          python -c "import curses; print('curses', getattr(curses,'version','?'))"

      - name: Unit tests (POSIX-only cases skipped)
        shell: pwsh
        continue-on-error: true
        id: tests
        run: |
          # The full report goes to an artifact: job logs cannot be fetched
          # from this repo's tooling, so the file is the only way to see why.
          python -m pytest -q -rf --tb=short -m "not needs_pty" `
            tests/test_fsops.py tests/test_archive.py tests/test_core_phase3.py *>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\pytest-win.txt"
          exit $LASTEXITCODE

      - name: Publish the pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pytest-report
          path: ${{ runner.temp }}/pytest-win.txt
          if-no-files-found: warn

      - name: Fail the job if the tests failed
        if: steps.tests.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "::error::unit tests failed - see the windows-pytest-report artifact"
          exit 1

      - name: Smoke - does curses import and init under Windows?
        shell: pwsh
        run: |
          python -c "import curses; print('windows-curses', curses.version)"

      - name: Build the executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --onefile `
            --name TwinPane `
            --console `
            --clean `
            --noconfirm `
            --add-data "twinpane;twinpane" `
            --hidden-import curses `
            --hidden-import curses.ascii `
            --hidden-import curses.has_key `
            --collect-submodules twinpane `
            run.py

      - name: Verify the binary exists and runs
        shell: pwsh
        run: |
          Get-Item dist\TwinPane.exe | Format-List Name, Length
          # --version must work without a terminal (prints and exits 0)
          & .\dist\TwinPane.exe --version

      - name: Zip the portable bundle
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE -Destination dist -ErrorAction SilentlyContinue
          Copy-Item docs -Destination dist\docs -Recurse -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\TwinPane.exe, dist\README.md, dist\docs `
                           -DestinationPath dist\TwinPane-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TwinPane-windows
          path: |
            twin-pane-explorer/dist/TwinPane.exe
            twin-pane-explorer/dist/TwinPane-windows.zip
          retention-days: 30

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            twin-pane-explorer/dist/TwinPane.exe
            twin-pane-explorer/dist/TwinPane-windows.zip
