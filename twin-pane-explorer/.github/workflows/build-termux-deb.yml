name: Build Termux package

# The native Android route for a curses TUI: a real .deb that `pkg install`s
# into Termux, plus the portable zip.  Also attaches them to a release when a
# v* tag is pushed.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev zip
          python -m pip install --upgrade pip pytest pexpect pyte pyflakes

      - name: Lint + unit tests
        run: |
          python -m pyflakes twinpane tests
          python -m pytest -q tests/test_fsops.py tests/test_archive.py \
                            tests/test_core_phase3.py

      - name: Build .deb + zip
        run: python build_dist.py

      - name: Validate the package
        run: |
          dpkg-deb --info dist/twinpane_*_all.deb
          dpkg-deb --contents dist/twinpane_*_all.deb | head -20
          mkdir -p /tmp/check && dpkg-deb -x dist/twinpane_*_all.deb /tmp/check
          test -f /tmp/check/data/data/com.termux/files/usr/bin/twinpane
          test -f /tmp/check/data/data/com.termux/files/usr/lib/twinpane/run.py
          python -c "import zipfile,glob;p=glob.glob('dist/twinpane-*.zip')[0];n=zipfile.ZipFile(p).namelist();assert any(x.endswith('twinpane/ui.py') for x in n);print('zip ok:',p,len(n),'files')"

      - uses: actions/upload-artifact@v4
        with:
          name: twinpane-termux
          path: |
            dist/twinpane_*_all.deb
            dist/twinpane-*.zip
            dist/SHA256SUMS
          retention-days: 60

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/twinpane_*_all.deb
            dist/twinpane-*.zip
            dist/SHA256SUMS
