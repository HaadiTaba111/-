# Extra keys for Twin-Pane Explorer on a phone keyboard.
#
# Copy the two "extra-keys" lines below into ~/.termux/termux.properties
# (create the file if it does not exist), then run:
#     termux-reload-settings
#
# The result is a two-row key bar above the keyboard with everything the
# app needs - no long-press hunting for F5/F6.

extra-keys = [ \
 ['ESC','TAB','/','-','HOME','UP','END','PGUP'], \
 ['CTRL','LEFT','DOWN','RIGHT','PGDN','F5','F6','F10'] \
]

# Handy additions, uncomment if you like them:
#   back-key = escape
#   extra-keys-style = default
